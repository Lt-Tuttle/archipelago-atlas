name: Release

# Pushing a tag like v0.1.0-beta.1 builds, tests and publishes that version. Run it by hand (Actions → Release → Run
# workflow) for a dry run: the same build and tests, with the zip kept as a workflow artifact and nothing published.
# Tools/bump_version.ps1 sets the version and prints the tag commands.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Godot must match the version in AP_Atlas.csproj's Sdk and the export templates Tools/get_export_templates.ps1 pins.
  # The hash is from Godot's published SHA512-SUMS.txt.
  GODOT_VERSION: 4.7.2-stable
  GODOT_SHA512: 79229fd112b0c9cbeab82363a4ef7be18ea70f1caf86bf912789335b136fbe7e01db0053a33461438c5da1c680c17bbb10040bd09bedc51221cd4423d0367757

jobs:
  release:
    name: Build, test and publish
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: The version (a tag must match the project version)
        shell: pwsh
        run: |
          [xml]$props = Get-Content -Raw Directory.Build.props
          $version = @($props.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'.TrimStart('v')
            if ($version -ne $tag) { throw "Tag v$tag doesn't match <Version>$version</Version> in Directory.Build.props." }
          }
          "ATLAS_VERSION=$version" >> $env:GITHUB_ENV

      - name: Guard rails
        shell: pwsh
        run: ./AP_Atlas_Source/Tools/check_guards.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # The UI test's fake logic engine runs on the Python the portable engine uses (3.12).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build
        working-directory: AP_Atlas_Source
        run: dotnet build AP_Atlas.sln -nologo

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-win64

      - name: Download Godot (hash-checked)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'godot.zip'
          $url = "https://github.com/godotengine/godot-builds/releases/download/$($env:GODOT_VERSION)/Godot_v$($env:GODOT_VERSION)_mono_win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($hash -ne $env:GODOT_SHA512) { throw "The Godot download doesn't match its published hash (got $hash)." }
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'godot')

      - name: Locate Godot
        shell: pwsh
        run: |
          $exe = Get-ChildItem (Join-Path $env:RUNNER_TEMP 'godot') -Recurse -Filter '*_console.exe' | Select-Object -First 1
          if (-not $exe) { throw 'Godot console executable not found.' }
          "ATLAS_GODOT=$($exe.FullName)" >> $env:GITHUB_ENV

      # The Windows export templates (about 210 MB unpacked, from a 1.2 GB archive checked against Godot's published hash).
      - name: Cache the export templates
        uses: actions/cache@v6
        with:
          path: Godot_Engine/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-mono-win-x86_64-${{ hashFiles('AP_Atlas_Source/Tools/get_export_templates.ps1') }}

      - name: Export templates (hash-checked)
        shell: pwsh
        run: ./AP_Atlas_Source/Tools/get_export_templates.ps1 -DeleteArchive

      - name: Import project resources
        shell: pwsh
        timeout-minutes: 10
        run: |
          & $env:ATLAS_GODOT --headless --path AP_Atlas_Source --import
          # The editor's exit code after importing isn't meaningful; the build below is the real check.
          exit 0

      # Exports the release, checks it, runs the self-test and UI test on the exported build, and packs the zip and
      # its SHA256SUMS.txt (Tools/build_release.ps1).
      - name: Build, test and package the release
        shell: pwsh
        run: ./AP_Atlas_Source/Tools/build_release.ps1 -Version $env:ATLAS_VERSION -OutDir dist -Godot $env:ATLAS_GODOT -ScratchRoot $env:RUNNER_TEMP

      - name: Keep the build's output when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-output
          path: |
            Builds/staging/export.log
            ${{ runner.temp }}/atlas-selftest-*/
          retention-days: 7
          if-no-files-found: ignore

      - name: Keep the zip and its checksum
        uses: actions/upload-artifact@v7
        with:
          name: TheArchipelagoAtlas-${{ env.ATLAS_VERSION }}-win-x64
          path: dist/
          retention-days: 14

      - name: Release notes from the changelog
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $lines = @(Get-Content CHANGELOG.md)
          $heading = "## [$($env:ATLAS_VERSION)]"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) { if ($lines[$i].StartsWith($heading)) { $start = $i; break } }
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $($env:ATLAS_VERSION)." }
          $notes = New-Object System.Collections.Generic.List[string]
          for ($i = $start + 1; $i -lt $lines.Count -and -not $lines[$i].StartsWith('## ['); $i++) { $notes.Add($lines[$i]) }
          Set-Content -Path release-notes.md -Value (($notes -join "`n").Trim()) -Encoding UTF8

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghArgs = @("v$($env:ATLAS_VERSION)", '--title', "The Archipelago Atlas $($env:ATLAS_VERSION)", '--notes-file', 'release-notes.md')
          if ($env:ATLAS_VERSION -match '-') { $ghArgs += '--prerelease' }
          $ghArgs += @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          gh release create @ghArgs
